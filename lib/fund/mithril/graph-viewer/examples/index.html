<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mithril Graph Viewer — standalone library</title><link rel="stylesheet" href="../src/viewer.css"><style>body{margin:30px;background:#f6f8fc;font-family:system-ui}main{max-width:1100px;margin:auto}h1{font-size:24px}.controls{display:flex;gap:12px;margin:18px 0}button{padding:10px}output{display:block;margin:12px}</style><main><h1>Graph Viewer · v0.1.1</h1><p>Sample data. The viewer displays supplied graphs and records without executing computation.</p><div class="controls"><button id="overview">Overview</button><button id="flow">Workflow record</button><button id="history">History record</button></div><output id="selection">Select a node to explore.</output><div id="viewer"></div></main><script type="module">
import {mount} from '../src/index.js';
const model={nodes:[{id:'campaign',label:'Marketing',types:['Activity'],domain:'architecture'},{id:'lead',label:'Prospect',types:['Person'],domain:'architecture'},{id:'contract',label:'Contract approval',types:['Activity'],domain:'architecture'},{id:'ceo',label:'CEO',types:['Person'],domain:'architecture'},{id:'product',label:'Mithril',domain:'architecture'},{id:'source',label:'viewer/index.js',domain:'code'},{id:'schema',label:'Activity',domain:'ontology'},{id:'evidence',label:'Execution record',external:true}],edges:[{source:'campaign',target:'lead',predicate:'reaches'},{source:'lead',target:'contract',predicate:'requests'},{source:'ceo',target:'contract',predicate:'approves'},{source:'campaign',target:'product',predicate:'promotes'},{source:'source',target:'product',predicate:'implements'},{source:'contract',target:'schema',predicate:'type'},{source:'evidence',target:'contract',predicate:'records'}]};
const computation={kind:'workflow',plan:{nodes:[{id:'inspect',op:'neighbors'},{id:'marketing',op:'increment'},{id:'operations',op:'increment'},{id:'merge',op:'join'},{id:'review',op:'pause'}],edges:[{from:'inspect',to:'marketing'},{from:'inspect',to:'operations'},{from:'marketing',to:'merge'},{from:'operations',to:'merge'},{from:'merge',to:'review'}]},result:{status:'paused',pending:[],trace:[{step:1,active:['inspect'],changed:[]},{step:2,active:['marketing','operations'],changed:['count']},{step:3,active:['merge'],changed:[]},{step:4,active:['review'],changed:[]}]}};
const output=document.querySelector('#selection');const viewer=mount(document.querySelector('#viewer'),{model,onSelect:(id,n)=>output.textContent='Selected: '+n.label,onStep:s=>output.textContent='Recorded step '+s});
document.querySelector('#overview').onclick=()=>viewer.setLayout('community');document.querySelector('#flow').onclick=()=>{viewer.setComputation(computation);viewer.setLayout('flow');};document.querySelector('#history').onclick=()=>{viewer.setComputation(computation);viewer.setLayout('river');};
</script></html>
