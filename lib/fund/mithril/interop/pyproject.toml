[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fund-mithril-lib-interop"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.xml", "*.cljk", "*.kotoba", "*.mith"]

[project.scripts]
mithril-interop = "mithril_interop.cli:main"
