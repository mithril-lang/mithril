<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mithril · Codegraph</title><link rel="stylesheet" href="/live.css"><script src="/live.js" defer></script></head>
<body><header><div><small>MITHRIL / LOCAL SOURCE GRAPH</small><h1>Explore code and documents through evidence.</h1><p>Search the complete index. References come from static analysis.</p></div><button id="refresh">Refresh sources</button></header>
<div id="notice" role="status">Loading index…</div><div id="metrics"></div>
<main><section class="browse"><form id="search"><label for="query">Search names, paths or source text</label><div class="row"><input id="query" placeholder="Example: sync-index / source-digest"><select id="mode" aria-label="Search scope"><option value="search">Name / path</option><option value="content">Exact text match</option><option value="communities">Community</option></select><button>Search</button></div></form><div id="results"></div><nav><button id="prev">Previous page</button><span id="page"></span><button id="next">Next page</button></nav></section>
<section class="inspect"><h2 id="title">Select an item</h2><div id="location"></div><div class="row"><button id="impact" disabled>Impact</button><button id="neighbors" disabled>Direct relationships</button></div><p id="precision"></p><pre id="source"></pre><div id="graph"></div><div id="relations"></div><details><summary>Index diagnostics</summary><pre id="diagnostics"></pre></details></section></main><footer id="revision"></footer></body></html>
