name: Dataset specification and SDK
on:
  push:
    branches: [main]
    paths: ['spec/**', 'sdk/python/**', 'resources/datalake/**', 'scripts/*dataset*', 'scripts/test-datalake.mjs', 'docs/dataset/**', 'docs/benchmarks/computable-datalake*', 'examples/dataset/**', '.github/workflows/dataset.yml']
  pull_request:
    paths: ['spec/**', 'sdk/python/**', 'resources/datalake/**', 'scripts/*dataset*', 'scripts/test-datalake.mjs', 'docs/dataset/**', 'docs/benchmarks/computable-datalake*', 'examples/dataset/**', '.github/workflows/dataset.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dataset-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0 markdown==3.8.2 jsonschema==4.25.1 './sdk/python[test]'
      - run: node --test scripts/test-datalake.mjs scripts/test-dataset-spec.mjs
      - run: python -m unittest discover -s sdk/python/tests
      - run: python examples/dataset/quickstart.py
      - run: python examples/dataset/query.py
      - run: python scripts/check-dataset-schema.py
      - run: python -m build sdk/python
      - run: |
          python -m venv /tmp/mithril-wheel
          /tmp/mithril-wheel/bin/pip install sdk/python/dist/*.whl pyarrow==25.0.1
          cd /tmp
          /tmp/mithril-wheel/bin/python "$GITHUB_WORKSPACE/examples/dataset/quickstart.py"
      - run: python scripts/build-dataset-site.py /tmp/dataset-site
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-publication
          path: |
            /tmp/dataset-site
            sdk/python/dist
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install markdown==3.8.2
      - run: python scripts/build-dataset-site.py /tmp/dataset-site
      - name: Publish under existing Pages demo without replacing it
        run: |
          git worktree add /tmp/mithril-pages origin/gh-pages-todo
          mkdir -p /tmp/mithril-pages/dataset
          rsync -a --delete /tmp/dataset-site/ /tmp/mithril-pages/dataset/
          cd /tmp/mithril-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dataset
          if ! git diff --cached --quiet; then
            git commit -m "Publish Dataset specification from $GITHUB_SHA"
            git push origin HEAD:gh-pages-todo
          fi
      - name: Request the existing branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
