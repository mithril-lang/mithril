name: Mission native plugins
on:
  push:
    branches: [main]
    paths: ["src/mithril/mission*", "src/mithril/library*", "bin/mithril-library.cljk", "test/*library*", "test/mithril/library*", "test/*mission*", "test/mithril/mission*", "scripts/run-mission-sci.mjs", "scripts/prepare-amu-deps.py", "lib/fund/mithril/**", ".github/workflows/mission-native.yml"]
  pull_request:
    paths: ["src/mithril/mission*", "src/mithril/library*", "bin/mithril-library.cljk", "test/*library*", "test/mithril/library*", "test/*mission*", "test/mithril/mission*", "scripts/run-mission-sci.mjs", "scripts/prepare-amu-deps.py", "lib/fund/mithril/**", ".github/workflows/mission-native.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1654
          bb: 1.12.218
      - run: npm install --global nbb@1.5.212
      # fund.mithril.lib.* v0.4.0 is vendored under lib/fund/mithril (12beedb).
      # The standalone fund.mithril.lib.* repos are no longer reachable from CI,
      # and their pyproject deps still point at those git URLs, so install the
      # vendored copies with --no-deps and add the third-party pins explicitly.
      - run: |
          python -m pip install 'lxml==6.1.3' 'xmlschema==4.3.2'
          python -m pip install --no-deps ./lib/fund/mithril/interop ./lib/fund/mithril/xml ./lib/fund/mithril/siso.link16 ./lib/fund/mithril/siso.c2sim ./lib/fund/mithril/siso.msdl
          python -m pip install --no-deps -e ./lib/fund/mithril/ieee.hla
          ./lib/fund/mithril/ieee.hla/scripts/build-hla.sh
      - run: node scripts/run-mission-sci.mjs test/run_mission.cljk
      - run: MITHRIL_INTEROP_PYTHON="$(command -v python)" MITHRIL_INTEROP_ROOT="$GITHUB_WORKSPACE/lib/fund/mithril/interop" MITHRIL_XML_ROOT="$GITHUB_WORKSPACE/lib/fund/mithril/xml" node scripts/run-mission-sci.mjs test/run_mission_native.cljk
      - run: MITHRIL_INTEROP_PYTHON="$(command -v python)" MITHRIL_INTEROP_ROOT="$GITHUB_WORKSPACE/lib/fund/mithril/interop" node scripts/run-mission-sci.mjs --classpath lib/fund/mithril/interop/src:lib/fund/mithril/xml/src:lib/fund/mithril/siso.link16/src test/run_library_adapter.cljk
      - run: |
          python -m pip install hy==1.3.0
          hy -c '(import fund.mithril.lib.xml :as xml fund.mithril.lib.siso.link16 :as link16) (assert (= (get (xml.resolve) "libraryId") "fund.mithril.lib.xml")) (assert (get (link16.invoke "link16-loopback") "binaryReadBack"))'
      - run: |
          git clone https://github.com/kotoba-lang/amu.git /tmp/amu
          git -C /tmp/amu checkout bbbdaa9cb5ee0ad4ff29e024e4a70c9db4f8c02b
          cd /tmp/amu
          # Amu's lock pins kotoba-lang repos that may be deleted or private.
          # Skip this cross-runtime check (with a visible warning) only when a
          # pinned dependency repo is unreachable; otherwise run it unchanged.
          missing=""
          for url in $(grep -oE 'https://github\.com/kotoba-lang/[a-z0-9-]+\.git' deps-lock.edn | sort -u); do
            GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code "$url" HEAD >/dev/null 2>&1 || missing="$missing ${url#https://github.com/}"
          done
          if [ -n "$missing" ]; then
            count=$(echo $missing | wc -w)
            echo "::warning title=Amu cross-runtime check skipped::$count Amu lock dependency repo(s) are unreachable:$missing"
            exit 0
          fi
          npm ci --ignore-scripts
          export GITLIBS="$RUNNER_TEMP/amu-gitlibs"
          python "$GITHUB_WORKSPACE/scripts/prepare-amu-deps.py" --amu-root /tmp/amu --gitlibs "$GITLIBS"
          python "$GITHUB_WORKSPACE/lib/fund/mithril/interop/scripts/test-kotoba-library.py" --amu-root /tmp/amu --source-root "$GITHUB_WORKSPACE/lib/fund/mithril/siso.link16/src" --library-id fund.mithril.lib.siso.link16 --member link16-loopback --invoke
