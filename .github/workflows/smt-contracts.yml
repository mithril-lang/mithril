name: SMT contracts (prototype)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smt-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/org-babashka-nbb
          ref: 829f0ba11016e925001d80e51f12848c4ad58112
          path: .test-engine
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Install pinned bootstrap runtime dependency without build scripts
        run: npm install --prefix .test-engine --omit=dev --ignore-scripts --no-audit --no-fund --package-lock=false --no-save import-meta-resolve@4.1.0
      - name: Install pinned z3 release (checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/z3.zip" https://github.com/Z3Prover/z3/releases/download/z3-4.13.4/z3-4.13.4-x64-glibc-2.35.zip
          echo "93f91f9c6f4a00a041c19fc7a74adc1f441c8244ce70d486e19abcd89c6a014b  $RUNNER_TEMP/z3.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP"
          echo "MITHRIL_Z3=$RUNNER_TEMP/z3-4.13.4-x64-glibc-2.35/bin/z3" >> "$GITHUB_ENV"
      - name: Prove, refute and bound the contract fixtures
        run: node scripts/test-smt-contracts.mjs --engine .test-engine/cli.js
